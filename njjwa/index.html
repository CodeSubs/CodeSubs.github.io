<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Najwa</title>
    <script src="https://telegram.org/js/telegram-web-app.js?61"></script>
</head>
<body>
    <script>
        (() => {
            const webApp = window.Telegram && window.Telegram.WebApp;
            const closeDelayMs = 1500;

            function closeSilently() {
                if (webApp && typeof webApp.close === "function") {
                    webApp.close();
                }
            }

            function run() {
                if (!webApp) {
                    return;
                }

                try {
                    webApp.ready();

                    if (typeof webApp.switchInlineQuery === "function") {
                        webApp.switchInlineQuery("", ["groups"]);
                    }
                } finally {
                    setTimeout(closeSilently, closeDelayMs);
                }
            }

            run();
        })();
    </script>
</body>
</html>
